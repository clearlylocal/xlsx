name: Check SheetJS releases
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version; leave blank to check the latest CDN release"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sheetjs-upstream-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download and validate the candidate release
        env:
          UPSTREAM_VERSION: ${{ inputs.version }}
        run: npm run update -- "$UPSTREAM_VERSION"

      - run: npm run build:check
      - run: npm test

      - name: Commit and push the validated release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add upstream/ xlsx.mjs types/index.d.ts LICENSE CHANGELOG.md package.json

          if git diff --cached --quiet; then
            echo "No upstream update."
            exit 0
          fi

          version=$(node -p "JSON.parse(require('node:fs').readFileSync('upstream/manifest.json', 'utf8')).version")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: bump xlsx to v$version"
          git push origin "HEAD:$DEFAULT_BRANCH"
